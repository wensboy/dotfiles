# main wallpapers
# exec hyprctl monitors to show monitors info and match yours.
wallpaper {
    monitor = eDP-2
    path = ~/.config/hypr/wallpapers/2.png
    fit_mode = cover
}

# fallback wallpapers
wallpaper {
    monitor =
    path = ~/Pictures/wallpapers/
    fit_mode = cover
    timeout = 3600
    order = random
}