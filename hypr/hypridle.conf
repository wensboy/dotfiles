general {
    lock_cmd = pidof hyprlock || hyprlock       # lock the screen
    before_sleep_cmd = loginctl lock-session    # lock current session before sleeping
    after_sleep_cmd = hyprctl dispatch dpms on  # wake up the screen after sleeping
}

listener {
    timeout = 150                               # idle 150s
    on-timeout = brightnessctl -s set 10%       # set brightness to 10%
    on-resume = brightnessctl -r                # reset brightness to default
}

listener {
    timeout = 300                               # idle 300s
    on-timeout = loginctl lock-session          # lock current session
}

listener {
    timeout = 330                               # after lock 30s
    on-timeout = hyprctl dispatch dpms off      # turn off the monitor
    on-resume = hyprctl dispatch dpms on        # turn on the monitor
}