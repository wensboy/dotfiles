  generator: "Weasel::UIStyleSettings"
  modified_time: "Sun Apr 19 10:44:25 2026"
  rime_version: 1.13.1
patch:
  "menu/page_size": 4
  "style/color_scheme": kanagawa-dark
  "style/preedit_type": composition
  "style/inline_preedit": false
  "style/display_tray_icon": true
  "speller/use_space": true
  
  "style/font_point": 10            # 候选文字字号（默认 12）
  "style/label_font_point": 9       # 序号字号
  "style/comment_font_point": 9     # 注释/拼音字号
  
  # 间距控制
  "style/min_width": 10             # 最小宽度
  "style/min_height": 0             # 最小高度（0 为自动）
  "style/border_width": 1           # 边框粗细
  "style/margin_x": 6               # 左右边距
  "style/margin_y": 4               # 上下边距（关键：减小此项压缩高度）
  "style/spacing": 5                # 候选项之间的间距
  "style/candidate_spacing": 8      # 候选词之间的水平间距
  
  # 行距（竖排时有效）
  "style/hilite_spacing": 2         # 高亮项与边框的间距
  "style/hilite_padding": 4         # 高亮项内边距
  

